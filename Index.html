<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic Tac Toe</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --primary: #38bdf8;
            --x-color: #f43f5e;
            --o-color: #10b981;
            --font-heading: 'Orbitron', sans-serif;
            --font-body: 'Poppins', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .screen { display: none; }
        .active { display: block; }

        h1 { 
            font-family: var(--font-heading);
            font-size: 2.2rem; 
            margin-bottom: 2rem; 
            color: var(--primary);
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            letter-spacing: 4px;
        }

        .menu-btn {
            font-family: var(--font-body);
            font-weight: 500;
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            font-size: 1rem;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .menu-btn:hover { 
            background: var(--primary); 
            color: var(--bg);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: var(--card);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .cell {
            font-family: var(--font-heading);
            aspect-ratio: 1/1;
            background: var(--bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .cell:hover { background: #1e293b; }
        .cell.taken { cursor: default; }

        .cell.x { color: var(--x-color); text-shadow: 0 0 10px rgba(244, 63, 94, 0.4); }
        .cell.o { color: var(--o-color); text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

        .status { 
            font-family: var(--font-heading);
            margin: 20px 0; 
            font-size: 1rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            min-height: 1.5em;
        }

        .back-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            margin-top: 25px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="mainMenu" class="screen active">
            <h1>TIC TAC TOE</h1>
            <button class="menu-btn" onclick="showDifficulty()">Single Player (vs AI)</button>
            <button class="menu-btn" onclick="startGame('double')">Double Player</button>
        </div>

        <div id="difficultyMenu" class="screen">
            <h1>DIFFICULTY</h1>
            <button class="menu-btn" onclick="startGame('single', 'easy')">Easy</button>
            <button class="menu-btn" onclick="startGame('single', 'difficult')">Difficult</button>
            <button class="menu-btn" onclick="startGame('single', 'hardcore')">Hardcore (Invincible)</button>
            <button class="back-btn" onclick="showMain()">← Back to Menu</button>
        </div>

        <div id="gameScreen" class="screen">
            <div id="gameStatus" class="status">Player X's Turn</div>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button class="menu-btn" style="margin-top: 25px;" onclick="resetGame()">Reset Board</button>
            <button class="back-btn" onclick="showMain()">Quit to Menu</button>
        </div>
    </div>

    <script>
        let mode = ''; 
        let difficulty = ''; 
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;

        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('gameStatus');

        function showMain() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('mainMenu').classList.add('active');
        }

        function showDifficulty() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('difficultyMenu').classList.add('active');
        }

        function startGame(m, d = '') {
            mode = m;
            difficulty = d;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
            resetGame();
        }

        function handleCellClick(e) {
            const index = e.target.dataset.index;

            // Basic validation
            if (board[index] !== "" || !isGameActive) return;
            
            // If Single Player, don't let user move during AI's turn
            if (mode === 'single' && currentPlayer === 'O') return;

            // Make the move for the CURRENT player (X or O)
            makeMove(index, currentPlayer);

            // If it's Single Player and the game is still going, queue the AI
            if (isGameActive && mode === 'single' && currentPlayer === 'O') {
                setTimeout(aiMove, 600); 
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            cells[index].innerText = player;
            cells[index].classList.add(player.toLowerCase(), 'taken');
            
            if (checkWinner()) return;

            // Switch players
            currentPlayer = (currentPlayer === "X") ? "O" : "X";
            statusText.innerText = `Player ${currentPlayer}'s Turn`;
        }

        function aiMove() {
            if (!isGameActive) return;
            
            let move;
            if (difficulty === 'easy') {
                move = getRandomMove();
            } else if (difficulty === 'difficult') {
                move = Math.random() > 0.4 ? getBestMove() : getRandomMove();
            } else {
                move = getBestMove(); 
            }
            
            if (move !== null) makeMove(move, "O");
        }

        function getRandomMove() {
            let available = board.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
            return available[Math.floor(Math.random() * available.length)];
        }

        // --- MINIMAX ALGORITHM ---
        function getBestMove() {
            let bestScore = -Infinity;
            let move = null;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            return move;
        }

        const scores = { O: 10, X: -10, tie: 0 };

        function minimax(board, depth, isMaximizing) {
            let result = evaluateBoard();
            if (result !== null) return scores[result];

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === "") {
                        board[i] = "O";
                        let score = minimax(board, depth + 1, false);
                        board[i] = "";
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === "") {
                        board[i] = "X";
                        let score = minimax(board, depth + 1, true);
                        board[i] = "";
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function evaluateBoard() {
            const winPaths = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let path of winPaths) {
                const [a, b, c] = path;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
            }
            if (!board.includes("")) return "tie";
            return null;
        }

        function checkWinner() {
            let result = evaluateBoard();
            if (result) {
                isGameActive = false;
                if (result === "tie") {
                    statusText.innerText = "It's a Draw!";
                    statusText.style.color = "var(--primary)";
                } else {
                    statusText.innerText = `Player ${result} Wins!`;
                    statusText.style.color = result === "X" ? "var(--x-color)" : "var(--o-color)";
                }
                return true;
            }
            return false;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentPlayer = "X";
            statusText.innerText = "Player X's Turn";
            statusText.style.color = "var(--text)";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('x', 'o', 'taken');
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    </script>
</body>
</html>
